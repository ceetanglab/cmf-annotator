<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · CMF 标注工具</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { --brand: #8c75ff; --ink: #2b2650; --text: #1b1f2e; --text-3: #8a8a8a; --line: #e7e7e7; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text); background: #fafafa;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line);
        border-radius: 14px; padding: 32px 28px 28px; text-align: center;
        box-shadow: 0 8px 24px rgba(27, 31, 46, 0.08);
      }
      .mark {
        width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 11px;
        background: linear-gradient(135deg, #8c75ff, #b3a2ff); color: #fff;
        display: grid; place-items: center; font: 700 18px/1 system-ui;
        box-shadow: 0 4px 12px rgba(140, 117, 255, 0.3);
      }
      h1 { margin: 0 0 8px; font-size: 19px; letter-spacing: 0.2px; }
      p { margin: 0 0 6px; font-size: 13px; line-height: 1.7; color: var(--text-3); }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
      a {
        display: inline-block; padding: 9px 18px; border-radius: 8px; font-size: 13px;
        text-decoration: none; transition: background 0.15s, border-color 0.15s;
      }
      a.primary { background: var(--ink); color: #fff; }
      a.primary:hover { background: #3a3468; }
      a.ghost { border: 1px solid var(--line); color: var(--text); }
      a.ghost:hover { border-color: #c9baff; color: var(--brand); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">C</div>
      <h1>这个地址没有内容</h1>
      <p>链接可能已经过期，或者地址输错了一个字符。</p>
      <p>工具本身还在，回首页就能继续用。</p>
      <div class="actions">
        <a class="primary" href="/">回到工具</a>
        <a class="ghost" href="/about.html">看看它能做什么</a>
      </div>
    </main>
  </body>
</html>
