# cmf.ceetang.com —— 单文件静态站点（预发用 test.cmf.ceetang.com 也是这套，换个 server_name 即可）
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/cmf.ceetang.com.conf
#   首次签发证书前，先把下面 443 段整段注释掉，只留 80 段：
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d cmf.ceetang.com        # 会自动补全 ssl_certificate 并加重定向
#   签发完再取消注释（或直接用 certbot 改好的文件）。
#
# 检查：sudo nginx -t && sudo systemctl reload nginx

server {
    listen      80;
    listen      [::]:80;
    server_name cmf.ceetang.com;

    # 证书签发（certbot 的 http-01 校验）需要这行能被访问到
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 写在 listen 里：nginx 1.18 / 1.20（CentOS 默认源）也认，只是 1.25+ 会给个 deprecated 提示，
    # 不影响运行。反过来用新语法 `http2 on;` 的话，老版本会直接 unknown directive 起不来。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name cmf.ceetang.com;

    ssl_certificate     /etc/letsencrypt/live/cmf.ceetang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmf.ceetang.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/cmf;
    index index.html;
    charset utf-8;

    # 单文件 561KB，压缩后约 170KB；图片是用户自己上传的，不经过这里
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 应用要读剪贴板（Ctrl+V 粘图）与本地存储，这两个不需要额外权限头，但别加厚 CSP 把 blob: 挡了
    # 导出 PNG 走的是 blob: / data: 下载，若将来加 CSP 需放行 img-src blob: data:

    # 发版必须立刻生效：首页永不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 单文件应用没有静态资源目录，其它路径一律回首页，别让用户看见 nginx 默认 404 页
    error_page 404 /index.html;
}
